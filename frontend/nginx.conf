server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The site uses hash routes, so no rewrite is needed; this only serves files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    # The backend is not published; the site reaches it through this path.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
}

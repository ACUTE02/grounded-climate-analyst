server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The site uses hash routes, so no rewrite is needed; this only serves files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    # No .ico file exists: send old-style requests to the SVG instead of answering with index.html.
    location = /favicon.ico {
        return 301 /favicon.svg;
    }

    # A missing build file is a 404, not the home page.
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }

    # The backend is not published; the site reaches it through this path.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
}
